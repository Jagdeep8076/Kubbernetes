apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: express-ingress
  labels:
    app.kubernetes.io/name: myingress

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: main-server-service
                port:
                  number: 80
      
          - pathType: Prefix
            path: "/api/product"
            backend:
              service:
                name: product-service
                port:
                  number: 80